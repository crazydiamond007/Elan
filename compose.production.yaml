# Prepare .env.production and TLS/database/media infrastructure before running.
services:
  web:
    build: .
    image: maison-elan:local
    env_file: .env.production
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/media
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host': __import__('os').environ['DJANGO_ALLOWED_HOSTS'].split(',')[0]}); urllib.request.urlopen(r, timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  media:
