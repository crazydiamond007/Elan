# Reviewed example: substitute real domains/certificates and media volume mount path.
# This is not installed or activated by the repository.
log_format maison_safe '$request_method $uri $status $request_time';
access_log /var/log/nginx/maison_access.log maison_safe;
server {
    listen 80;
    server_name demo.example.com;
    return 301 https://demo.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name demo.example.com;
    ssl_certificate /etc/ssl/maison/fullchain.pem;
    ssl_certificate_key /etc/ssl/maison/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host demo.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 35s;
        # Django supplies HTML compression with randomized padding; do not cache HTML.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
server {
    listen 443 ssl;
    server_name media.example.net;
    ssl_certificate /etc/ssl/maison-media/fullchain.pem;
    ssl_certificate_key /etc/ssl/maison-media/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/maison-media;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    location ~ "^/products/[0-9]+/[a-f0-9]{32}\.webp$" {
        types { image/webp webp; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }
    location / { return 404; }
}
