<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <title>MAISON ÉLAN</title>
  <!-- Charcoal ground with an ivory É. A tab icon renders at 16px, so the mark is drawn on the
       brand's dark tone rather than its near-white one: an ivory tile disappears into a light
       browser chrome, while this reads against both light and dark themes. Stroke width is set
       for that 16px size, where a 48-unit viewBox divides each unit by three. -->
  <rect width="48" height="48" fill="#222222"/>
  <path d="M16 14v22h17M16 25h13M16 14h17M25 9.5l5.5-5.5" fill="none" stroke="#f7f5f0"
        stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
